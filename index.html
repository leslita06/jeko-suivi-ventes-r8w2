<style>
:root{--violet:#3A0BA3;--jaune:#FDC500;--orange:#FA5025;--ink:#1B1B2F;--gris:#6B6F80;--fond:#F6F4FF}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--fond);color:var(--ink);font-size:14px}
header{background:var(--violet);color:#fff;padding:18px 24px}header h1{margin:0;font-size:20px;font-weight:800}header h1 span{color:var(--jaune)}
main{max-width:440px;margin:0 auto;padding:44px 24px 60px}h2{font-size:20px;margin:0 0 6px;color:var(--violet)}p{margin:0 0 20px;color:var(--gris)}

.cb{flex-direction:row;align-items:center;gap:8px;font-weight:400;font-size:13px}.cb input{accent-color:var(--violet);margin:0}
button{margin-top:6px;padding:12px 16px;background:var(--violet);color:#fff;border:0;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}button[disabled]{opacity:.6;cursor:wait}
.err{padding:10px 12px;background:#FFE2DA;color:#B0301B;border-radius:10px;font-size:13px;font-weight:600}.note{margin-top:26px;font-size:12px;color:var(--gris);line-height:1.5}

const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
const $ = s => document.querySelector(s);
const enc = s => new TextEncoder().encode(s);
async function empreinte(s){ const h = await crypto.subtle.digest('SHA-256', enc(s)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0,16); }
// la clé de la personne ouvre l'enveloppe qui contient la clé de contenu
async function derive(email, pwd){
  const em = email.trim().toLowerCase(), id = await empreinte(em);
  const u = USERS.find(x => x.id === id);
  if(!u) throw new Error('acces inconnu');
  const km = await crypto.subtle.importKey('raw', enc(em+'\n'+pwd), 'PBKDF2', false, ['deriveKey']);
  const ku = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(u.salt), iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const kraw = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(u.wiv)}, ku, b64(u.wk));
  return crypto.subtle.importKey('raw', kraw, {name:'AES-GCM'}, true, ['decrypt']);
}
async function dechiffre(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(CT));
  return new TextDecoder().decode(pt);
}
function affiche(html){ document.open(); document.write(html); document.close(); }
async function depuisMemoire(){
  let raw = null;
  try { raw = localStorage.getItem(K) || sessionStorage.getItem(K); } catch(e) {}
  if (!raw) return false;
  try {
    const key = await crypto.subtle.importKey('raw', b64(raw), {name:'AES-GCM'}, true, ['decrypt']);
    affiche(await dechiffre(key)); return true;
  } catch(e) { try { localStorage.removeItem(K); sessionStorage.removeItem(K); } catch(_) {} return false; }
}
$('#g-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#g-btn'), err = $('#g-err');
  btn.disabled = true; btn.textContent = 'Ouverture…'; err.hidden = true;
  try {
    const key = await derive($('#g-email').value, $('#g-pwd').value);
    const html = await dechiffre(key);
    try {
      const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))));
      ($('#g-keep').checked ? localStorage : sessionStorage).setItem(K, raw);
    } catch(_) {}
    affiche(html);
  } catch(e) {
    err.hidden = false; btn.disabled = false; btn.textContent = 'Ouvrir le tableau de bord';
    $('#g-pwd').value = ''; $('#g-pwd').focus();
  }
});
depuisMemoire().then(ok => { if (!ok) $('#g-email').focus(); });
})();
